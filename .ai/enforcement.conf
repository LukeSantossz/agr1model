# Enforcement Configuration
# Debug statement patterns by language
# Used by pre-commit hook

# JavaScript/TypeScript patterns
JS_PATTERNS="console\.(log|debug|info|warn|error)|debugger"

# Python patterns
PY_PATTERNS="print\(|breakpoint\(\)|pdb\.set_trace\(\)"

# Java patterns
JAVA_PATTERNS="System\.out\.print"

# Go patterns
GO_PATTERNS="fmt\.Print|log\.Print"

# Ruby patterns
RB_PATTERNS="puts |p |pp |binding\.pry"
